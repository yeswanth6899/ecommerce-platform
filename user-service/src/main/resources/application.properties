spring.datasource.password= 1432578@Yeshu

#Hibernate

spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql = true

#It is True by default> That keeps the Hibernate Session open until the response is returned. but for better performance we will set it to false
spring.jpa.open-in-view= false 

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


#JWT
jwt.secret=MySuperSecretKeyForEcommercePlatformJwtAuthenticationProject2026SecureKey123456789
jwt.expiration=3600000

# ==========================
# Notification Configuration
# ==========================

# Maximum number of retry attempts before marking a delivery as ABANDONED
notification.retry.max-attempts=3

# Process newly created notifications every 30 seconds
notification.processing.delay=30s

# Retry failed notifications every 5 minutes
notification.retry.delay=5m

# Recover notifications stuck in PROCESSING state every 5 minutes
notification.recovery.delay=5m

spring.jackson.deserialization.fail-on-unknown-properties=true

# Consider a notification stuck if it remains in PROCESSING for 10 minutes
notification.processing.timeout=10m